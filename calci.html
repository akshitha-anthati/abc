<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>scientific calculator</title>
</head>
<style>
    body{
        text-align: center;
        background-color: aqua;
    }
    .calculator{
        width: 300px;
        margin:auto;
        padding:20px;
        border: 30px;
        border-radius: 34px;
    }
    input{
        width: 90%;
        height: 45px;
        font-size: 45px;
        text-align: right;
    }

</style>
<body>
    <h2>scientific calculator</h2>
    <div class="calculator">
        <input type="text" id="display" readonly>
        <br>
        <button onclick="clearDisplay()">C</button>
        <button onclick="backspace()">x</button>
        <button onclick="calculate(square)">xsq</button>
        <button onclick="calculate(sqrt)">sq</button>
        <br>

        <button onclick="append('7')">7</button>
        <button onclick="append('8')">8</button>
        <button onclick="append('9')">9</button>
        <button onclick="append('/')">/</button>
        <br>
        <button onclick="append('4')">4</button>
        <button onclick="append('5')">5</button>
        <button onclick="append('6')">6</button>
        <button onclick="append('*')">*</button>
         <br>
        <button onclick="append('3')">3</button>
        <button onclick="append('2')">2</button>
        <button onclick="append('1')">1</button>
        <button onclick="append('-')">-</button>
         <br>
        <button onclick="append('0')">0</button>
        <button onclick="append('.')">.</button>
        <button onclick="calculate('equal')">=</button>
        <button onclick="append('+')">+</button>
         <br>
        <button onclick="calculate('sin')">sin</button>
        <button onclick="append('cos')">cos</button>
        <button onclick="append('tan')">tan</button>
        <button onclick="append('log')">log</button>
        <br>


    </div><script>
        function append(value){
            document.getElementById("display").value+=value;
        }
        function clearDisplay(value){
            document.getElementById("display").value="";
        }
        function backspace(){
            let d=document.getElementById("display");
           d.value=d.value.slice(0,-1);
        }
        function calculate(op){
                let d=document.getElementById("display");
                let value=parseFloat(d.value);
                if(op=="equal"){
                    try{
                        d.value=eval(d.value);

                    }
                    catch{
                        d.value="error";
                    }
                }
                else if(op=="square"){
                    d.value=value*value;
                }else if(op=="sqrt"){
                    d.value=Math.sqrt(calue);
                }
                else if(op=="sin"){
                    d.value=Math.sin(value*Math.PI/180);
                }
                  else if(op=="cos"){
                    d.value=Math.cos(value*Math.PI/180);
                }
                  else if(op=="tan"){
                    d.value=Math.tan(value*Math.PI/180);
                }
                  else if(op=="log"){
                    d.value=Math.log10(value);
                }
        }

    </script>


    
</body>
</html>
